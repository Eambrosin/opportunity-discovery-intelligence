name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application modules
        run: |
          python -m py_compile app.py discovery_engine.py web_discovery.py contact_discovery.py account_enrichment.py sales_intelligence.py field_sales_intelligence.py presets.py territory_profiles.py territory_intelligence.py vendor_profiles.py ai_insights.py

      - name: Smoke-test application imports
        run: |
          python -c "from account_enrichment import assess_qualification_readiness, enrich_account; from sales_intelligence import build_sales_intelligence; from field_sales_intelligence import build_field_sales_intelligence, revenue_target_scenarios; from discovery_engine import qualification_handoff"

      - name: Run discovery-engine tests
        run: |
          python -m unittest discover -s tests -v

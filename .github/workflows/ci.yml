name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application modules
        run: |
          python -m py_compile app.py discovery_engine.py web_discovery.py contact_discovery.py account_enrichment.py sales_intelligence.py field_sales_intelligence.py milano_discovery.py evidence_snapshot.py presets.py territory_profiles.py territory_intelligence.py vendor_profiles.py ai_insights.py

      - name: Smoke-test application imports
        run: |
          python -c "from account_enrichment import assess_qualification_readiness, enrich_account; from sales_intelligence import build_sales_intelligence; from field_sales_intelligence import build_field_sales_intelligence, revenue_target_scenarios, revenue_execution_capacity; from milano_discovery import build_milano_discovery_plan; from evidence_snapshot import build_relevant_evidence_snapshot; from discovery_engine import qualification_handoff"

      - name: Validate app import contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("app.py").read_text())
          imported = set()
          used = set()

          for node in ast.walk(tree):
              if isinstance(node, ast.ImportFrom):
                  for alias in node.names:
                      imported.add(alias.asname or alias.name)
              elif isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load):
                  used.add(node.id)

          symbol = "build_milano_discovery_plan"
          if symbol in used and symbol not in imported:
              raise SystemExit(
                  f"app.py uses {symbol} but does not import it"
              )
          print("App import contract OK")
          PY

      - name: Run discovery-engine tests
        run: |
          python -m unittest discover -s tests -v
